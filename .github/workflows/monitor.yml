name: Canada job monitor
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: job-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          GOOGLE_ALERT_RSS_1: ${{ secrets.GOOGLE_ALERT_RSS_1 }}
          GOOGLE_ALERT_RSS_2: ${{ secrets.GOOGLE_ALERT_RSS_2 }}
          GOOGLE_ALERT_RSS_3: ${{ secrets.GOOGLE_ALERT_RSS_3 }}
          GOOGLE_ALERT_RSS_4: ${{ secrets.GOOGLE_ALERT_RSS_4 }}
          GOOGLE_ALERT_RSS_5: ${{ secrets.GOOGLE_ALERT_RSS_5 }}
        run: python -m jobmonitor.main
      - name: Persist deduplication database
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -n "$DATABASE_URL" ] || [ -n "$SUPABASE_DB_URL" ]; then
            echo "PostgreSQL/Supabase configured; skipping SQLite commit."
            exit 0
          fi
          if [ -f jobs.sqlite3 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -f jobs.sqlite3
            if ! git diff --cached --quiet; then
              git commit -m 'chore: update seen jobs [skip ci]'
              git pull --rebase origin "${GITHUB_REF_NAME}"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          fi
      - name: Generate job hub
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -m jobmonitor.dashboard --output public/index.html
      - uses: actions/configure-pages@v5
        if: always()
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: public
      - name: Deploy job hub
        if: always()
        uses: actions/deploy-pages@v4
